<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#d9141e">
  <title>EISBERG - Administração</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Login -->
  <div class="login-wrap" id="login">
    <form class="login-box" id="login-form">
      <div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:12px">
        <img src="img/mascote.svg" alt="Mascote" style="width:38px;height:62px;object-fit:contain">
        <h1 class="brand-name" id="login-brand-name" style="font-size:36px;margin:0">EISBERG</h1>
      </div>
      <h2 style="text-align:center;margin:0 0 16px">Administração</h2>
      <div class="form-group">
        <label for="email">Login</label>
        <input type="text" id="email" autocomplete="username" placeholder="Digite seu login ou e-mail" required>
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
      </div>
      <p class="error-msg" id="login-error" hidden></p>
      <button class="btn" style="width:100%">Entrar</button>
      <p style="text-align:center"><a href="index.html" style="color:#999;font-size:13px">← Voltar ao app de pedidos</a></p>
    </form>
  </div>

  <!-- Painel -->
  <div id="panel" hidden>
    <header class="admin-bar">
      <div class="brand">
        <img src="img/mascote.svg" alt="Mascote" style="width:28px;height:46px;object-fit:contain">
        <h1 class="brand-name" style="color:#fff;font-size:28px" id="admin-brand-name">EISBERG</h1>
        <span class="sub" style="font-size:14px">Administração</span>
      </div>
      <div style="display:flex;gap:8px">
        <a class="btn sm" href="index.html" target="_blank">Ver app</a>
        <button class="btn sm" id="logout">Sair</button>
      </div>
    </header>
    <nav class="tabs" id="tabs">
      <button data-tab="pedidos" class="active">Pedidos</button>
      <button data-tab="produtos">Produtos</button>
      <button data-tab="categorias">Categorias</button>
      <button data-tab="empresa">⚙️ Dados da Empresa</button>
    </nav>
    <main class="admin-main" id="main"></main>
  </div>

  <div id="modal-root"></div>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
